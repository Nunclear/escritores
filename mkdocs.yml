site_name: Documentación Escritores Backend
site_description: Documentación técnica completa del backend del sistema Escritores
site_author: Nunclear
site_url: https://docs.escritores.com

# Tema
theme:
  name: material
  logo: https://via.placeholder.com/32x32.png?text=ES
  favicon: https://via.placeholder.com/16x16.png?text=ES
  language: es
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/toggle-switch-outline
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

# Plugins
plugins:
  - search:
      lang: es
  - mermaid2
  - table-reader

# Extensiones de Markdown
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: "!!python/name:pymdownx.superfences.fence_code_format"
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html

# Navegación
nav:
  - Inicio: index.md
  
  - Guía Rápida:
    - Arquitectura: arquitectura.md
    - Estructura: estructura.md
    - Configuración: configuracion.md
  
  - Diseño de Datos:
    - Base de Datos: base-datos.md
    - Entidades: entidades.md
  
  - Implementación:
    - Repositorios: repositorios.md
    - Servicios: servicios.md
    - Controladores: controladores.md
  
  - API:
    - Endpoints REST: endpoints.md
  
  - Seguridad:
    - Autenticación y Autorización: seguridad.md
  
  - Despliegue:
    - Ejecución Local: ejecucion-local.md
    - Compilación y Despliegue: despliegue.md
  
  - Soporte:
    - Errores Comunes y Soluciones: errores-comunes.md

# Variables de configuración
extra:
  version: 0.0.1-SNAPSHOT
  project_name: Escritores
  organization: Nunclear
  repository_url: https://github.com/Nunclear/escritores
  
# Footer
copyright: Copyright &copy; 2026 Nunclear. Todos los derechos reservados.

# Configuración adicional
docs_dir: docs
site_dir: site
